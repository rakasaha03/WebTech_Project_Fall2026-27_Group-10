<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Registration | CineBook</title><link rel="stylesheet" href="../Design/Style.css"><link rel="stylesheet" href="CSS/admin.css"></head>
<body><header><a class="brand" href="../index.html">Cine<span>Book</span></a><span>Admin Portal</span></header>
<nav><a href="../index.html">Home</a><a href="AdminLogin.html">Admin Login</a><a href="AdminRegistration.html">Admin Registration</a><a href="Dashboard.html">Dashboard</a><a href="ManageMovies.html">Movies</a></nav><main>
<section class="panel"><h1>Create Admin Account</h1><p class="muted">Enter your details to request administrator access.</p>
<form id="adminRegisterForm">
<div class="form-grid">
<div><label for="fullName">Full Name</label><input id="fullName" required placeholder="Enter your full name"></div>
<div><label for="username">Username</label><input id="username" required placeholder="Choose a username"></div>
<div><label for="email">Email Address</label><input id="email" type="email" required placeholder="Enter your email"></div>
<div><label for="phone">Phone Number</label><input id="phone" type="tel" required placeholder="Enter your phone number"></div>
<div><label for="password">Password</label><input id="password" type="password" required minlength="6" placeholder="At least 6 characters"></div>
<div><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" required placeholder="Enter password again"></div>
</div>
<button type="submit">Register</button><div id="message" class="message"></div>
</form>
</section></main><footer>CineBook · Cinema Booking System</footer>
<script src="JS/admin.js"></script></body></html>
